name: Release

# Push a tag such as v0.1.0 (or v0.2.0-beta.1) to build, test and publish a GitHub release with installers and
# portable zips for x64 and arm64.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Isolate app data
        shell: pwsh
        run: '"FIELDKIT_DATA_DIR=$env:RUNNER_TEMP\fieldkit-release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Build and test
        run: |
          dotnet build Fieldkit.sln -c Release -warnaserror
          dotnet test Fieldkit.sln -c Release --no-build

      - name: Publish x64 and arm64
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Fieldkit/Fieldkit.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=false -p:PublishReadyToRun=false -p:DebugType=none -p:Version=$version -o "artifacts/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Selftest the published exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $p = Start-Process -FilePath "artifacts/win-x64/Fieldkit.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      # The exe is not compressed (a compressed single-file app keeps its assemblies unpacked in memory),
      # so the download is a zip: about 70 MB instead of about 190 MB.
      - name: Zip the exes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            Compress-Archive -Path "artifacts/$rid/Fieldkit.exe" -DestinationPath "artifacts/Fieldkit-$version-$rid.zip" -CompressionLevel Optimal
          }

      # The installers: per user, no administrator prompt, Start menu shortcut, clean uninstall.
      - name: Build the installers
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          foreach ($arch in 'x64', 'arm64') {
            & $iscc /Q "/DAppVersion=$version" "/DArch=$arch" installer/Fieldkit.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Smoke-test the x64 installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $dir = Join-Path $env:RUNNER_TEMP 'fieldkit-install'
          $setup = Start-Process -FilePath "artifacts/Fieldkit-$version-setup-x64.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or -not (Test-Path "$dir/Fieldkit.exe")) { Write-Error "Install failed ($($setup.ExitCode))"; exit 1 }
          $uninstall = Start-Process -FilePath "$dir/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 2 # the uninstaller finishes removing itself from a copy in %TEMP%
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$dir/Fieldkit.exe")) { Write-Error "Uninstall failed ($($uninstall.ExitCode))"; exit 1 }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $flags = @('--title', "Fieldkit $version")
          if ($tag.Contains('-') -or $version.StartsWith('0.')) { $flags += '--prerelease' }
          # The release notes are this version's section of CHANGELOG.md: they are what Fieldkit's update prompt shows.
          $lines = Get-Content CHANGELOG.md
          $heading = $lines | Select-String -Pattern ('^## ' + [regex]::Escape($version) + '( |$)') | Select-Object -First 1
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          if ($heading) {
            $body = @()
            for ($i = $heading.LineNumber; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $body += $lines[$i] }
            ($body -join "`n").Trim() | Set-Content -Path $notes -Encoding utf8
          }
          if ((Test-Path $notes) -and (Get-Item $notes).Length -gt 0) { $flags += @('--notes-file', $notes) } else { $flags += '--generate-notes' }
          gh release create $tag `
            "artifacts/Fieldkit-$version-setup-x64.exe" "artifacts/Fieldkit-$version-setup-arm64.exe" `
            "artifacts/Fieldkit-$version-win-x64.zip" "artifacts/Fieldkit-$version-win-arm64.zip" @flags
