name: Release

# Push a tag such as v0.1.0 (or v0.2.0-beta.1) to build, test and publish a GitHub release with the zipped exes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Isolate app data
        shell: pwsh
        run: '"FIELDKIT_DATA_DIR=$env:RUNNER_TEMP\fieldkit-release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Build and test
        run: |
          dotnet build Fieldkit.sln -c Release -warnaserror
          dotnet test Fieldkit.sln -c Release --no-build

      - name: Publish x64 and arm64
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Fieldkit/Fieldkit.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=false -p:PublishReadyToRun=false -p:DebugType=none -p:Version=$version -o "artifacts/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Selftest the published exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $p = Start-Process -FilePath "artifacts/win-x64/Fieldkit.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      # The exe is not compressed (a compressed single-file app keeps its assemblies unpacked in memory),
      # so the download is a zip: about 70 MB instead of about 190 MB.
      - name: Zip the exes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            Compress-Archive -Path "artifacts/$rid/Fieldkit.exe" -DestinationPath "artifacts/Fieldkit-$version-$rid.zip" -CompressionLevel Optimal
          }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $flags = @('--generate-notes', '--title', "Fieldkit $version")
          if ($tag.Contains('-') -or $version.StartsWith('0.')) { $flags += '--prerelease' }
          gh release create $tag "artifacts/Fieldkit-$version-win-x64.zip" "artifacts/Fieldkit-$version-win-arm64.zip" @flags
